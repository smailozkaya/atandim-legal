<title>Atandım — Yasal Bilgiler</title>
<style>
  :root {
    --bg: #F6F7FB; --card: #FFFFFF; --ink: #1B1E2B; --muted: #5A6175;
    --line: #E3E6EE; --accent: #FF9F1C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131A; --card: #1C1E26; --ink: #F3F4F8; --muted: #A0A5B5;
      --line: #2E3242;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.65; font-size: 16px;
  }
  .kapsayici { max-width: 760px; margin: 0 auto; padding: 32px 16px 72px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 20px; flex: none;
  }
  .marka { font-weight: 800; font-size: 18px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 24px 0 4px; letter-spacing: -0.4px; }
  .tarih { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .giris {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; color: var(--muted); margin-bottom: 28px;
  }
  h2 { font-size: 18px; margin: 32px 0 8px; letter-spacing: -0.2px; }
  p { margin: 0 0 12px; }
  a { color: var(--accent); }
  nav { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 14px;
  }
</style>
</head>
<body>
  <div class="kapsayici">
    <header>
      <div class="logo">A</div>
      <div class="marka">Atandım</div>
    </header>
